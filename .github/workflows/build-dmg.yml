name: Build private macOS DMG
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "scripts/**"
      - ".github/workflows/build-dmg.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS application
        run: bash scripts/build-dmg.sh
      - name: Verify package
        run: |
          test -s dist/OrbitStore-0.1.0-unsigned.dmg
          codesign --verify -v dist/staging/OrbitStore.app
          hdiutil verify dist/OrbitStore-0.1.0-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitStore-0.1.0-DMG
          path: |
            dist/OrbitStore-0.1.0-unsigned.dmg
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
