name: Build and publish macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "scripts/Info.plist"
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$VERSION"; exit 1
          fi
      - name: Build macOS application
        run: bash scripts/build-dmg.sh
      - name: Verify DMG and ad-hoc app signature
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          test -s "dist/OrbitStore-$VERSION-unsigned.dmg"
          codesign --verify -v dist/staging/OrbitStore.app
          hdiutil verify "dist/OrbitStore-$VERSION-unsigned.dmg"
      - name: Publish pre-release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite."; exit 1
          fi
          gh release create "$TAG" "dist/OrbitStore-$VERSION-unsigned.dmg" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "OrbitStore $VERSION — macOS alpha" \
            --notes "Community alpha. Ad-hoc signed, not Apple-notarized. Check README and SECURITY.md." --prerelease
