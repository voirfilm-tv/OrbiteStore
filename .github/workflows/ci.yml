name: OrbitStore CI
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and validate macOS application package
        run: |
          bash scripts/build-dmg.sh
          test -s dist/staging/OrbitStore.app/Contents/Resources/OrbitStore.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/staging/OrbitStore.app/Contents/Info.plist)" = "OrbitStore.icns"
      - name: Unit tests if available
        run: |
          if [ -d Tests ]; then swift test; else echo "No unit-test target yet."; fi
