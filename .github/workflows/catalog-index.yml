name: Build searchable macOS catalog index

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/index_catalog.py"
      - "scripts/catalog-seeds.json"
      - "tests/test_catalog_index.py"
      - ".github/workflows/catalog-index.yml"

permissions:
  contents: write

concurrency:
  group: orbitstore-catalog-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check index filters and classifier
        run: python3 -m unittest discover -s tests -p 'test_catalog_index.py' -v
      - name: Discover and validate actual macOS GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/index_catalog.py
      - name: Validate public feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data/catalog-index.json").read_text(encoding="utf-8"))
          assert data["schema"]==1
          assert data["count"]==len(data["entries"])
          assert all(x.get("asset_name") and x.get("repo") for x in data["entries"])
          assert len(data["entries"])==len({x["repo"].lower() for x in data["entries"]})
          print("Verified macOS apps:",data["count"],data["categories"])
          PY
      - name: Commit refreshed index only when content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged."
            exit 0
          fi
          git commit -m "data: refresh verified macOS catalog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
